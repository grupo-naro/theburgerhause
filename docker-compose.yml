services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: burgerhause
      POSTGRES_PASSWORD: burgerhause
      POSTGRES_DB: burgerhause
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U burgerhause -d burgerhause"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
