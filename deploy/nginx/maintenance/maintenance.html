  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; text-align: center;
    background: #0b1220; color: rgba(255, 255, 255, 0.75);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  p { margin: 0.4em; }
  .big { font-size: clamp(1.5rem, 4vh, 3rem); font-weight: 700; }
  .small { font-size: clamp(0.9rem, 2vh, 1.2rem); color: rgba(255, 255, 255, 0.5); }
</style>
</head>
<body>
<main>
  <p class="big">Reconectando…</p>

</main>
