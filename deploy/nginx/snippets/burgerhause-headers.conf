# Security headers. Install as /etc/nginx/snippets/burgerhause-headers.conf.
# Included at server{} level AND inside any location that declares its own add_header
# (add_header is not inherited into a location that has one).
add_header Strict-Transport-Security "max-age=31536000" always;   # no "preload" until the owner decides
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy $bh_referrer_policy always;            # see 00-burgerhause-zones.conf
