# Shared proxy settings for every location that talks to the app.
# Install as /etc/nginx/snippets/burgerhause-proxy.conf and `include` it in each proxied location
# (proxy_set_header is NOT inherited once a location defines its own, so it lives in one snippet).
proxy_pass http://burgerhause_app;
proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
# OVERWRITE with the real TCP peer. NEVER use $proxy_add_x_forwarded_for: the app trusts the LAST hop
# of X-Forwarded-For for rate limiting and audit, and anything the client sends must not survive.
proxy_set_header X-Forwarded-For $remote_addr;
# Not used by the app; set explicitly so a client cannot inject them.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Forwarded "";
# Next.js internal header (CVE-2025-29927 class): a client must never be able to send it.
proxy_set_header x-middleware-subrequest "";

# Never retry a request on another upstream (there is only one, and POSTs are not idempotent).
proxy_next_upstream off;

# The app also sets these (so `next start` without Nginx is equally protected). Nginx owns them in
# production (burgerhause-headers.conf), so hide the upstream copy: each header must appear once.
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Powered-By;
