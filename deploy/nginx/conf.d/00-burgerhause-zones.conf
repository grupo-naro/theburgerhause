# The Burger Hause - http-level Nginx config (rate-limit zones, maps).
# Install as /etc/nginx/conf.d/00-burgerhause-zones.conf  (conf.d/*.conf is included in the http{} block).
#
# IMPORTANT - shared venue IP: the 9 staff PCs and the 9 print agents of the restaurant all reach the
# server from ONE public IP. Nginx only caps the VOLUME of requests per IP (a safety net against floods);
# it is NOT the brute-force defense. Login brute force is handled by the app's own limiter
# (5 attempts / 15 min per ip+username, 20 / 15 min per ip), which sees the real client IP through
# X-Forwarded-For. All zones are keyed on $binary_remote_addr = the real TCP peer (no CDN in front).

# Public order page + its API (customers; mobile carriers often share an IP, hence 10 r/s + burst 20).
limit_req_zone $binary_remote_addr zone=bh_pedido:10m rate=10r/s;
# Staff login volume cap. The login form is a Server Action posted to /login (GET + POST per login) and every
# expired session redirects to /login, so the whole venue can hit it at once: 30 r/m + burst 30 is generous.
limit_req_zone $binary_remote_addr zone=bh_login:10m rate=30r/m;
# Print agents: 9 PCs poll/heartbeat from the same IP -> generous.
limit_req_zone $binary_remote_addr zone=bh_agent:10m rate=30r/s;
# Image uploads (admin only, 5 MB each).
limit_req_zone $binary_remote_addr zone=bh_upload:10m rate=2r/s;
# Everything else (pages, Server Actions such as the order submit and the open/closed check, health):
# a volume cap against floods. 30 r/s per IP with burst 100 is far above what the venue (one IP, 9 PCs) or a
# shared mobile-carrier address produces; static assets (/_next/static/) are exempt, a page load fetches ~20.
limit_req_zone $binary_remote_addr zone=bh_general:10m rate=30r/s;
# Concurrent SSE streams per IP: 9 staff PCs (a few tabs each) + 9 agents share one IP -> cap of 60 is used.
limit_conn_zone $binary_remote_addr zone=bh_sse:10m;

# Answer 429 (not the default 503) so a throttled client is distinguishable from an outage.
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
limit_conn_log_level warn;

# Default Referrer-Policy ONLY when the app did not set its own (/pedido sends "no-referrer" itself;
# Nginx must not add a second, conflicting header). An empty value makes add_header skip the header.
map $upstream_http_referrer_policy $bh_referrer_policy {
    default "";
    ""      "strict-origin-when-cross-origin";
}
