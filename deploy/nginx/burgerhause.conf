# The Burger Hause - Nginx site (TLS terminator + reverse proxy to ONE Next.js process).
# Install as /etc/nginx/sites-available/burgerhause.conf, symlink into sites-enabled/.
# Needs (same repo, deploy/nginx/): conf.d/00-burgerhause-zones.conf and snippets/*.conf.
#
# REPLACE before use:  burgerhause.example.com  ->  your domain (every occurrence: server_name x2, certificate paths x4).
# Certificates: `certbot certonly --webroot -w /var/www/certbot -d burgerhause.example.com` (see docs/ops/runbook.md).
#
# Ubuntu 22.04 ships nginx 1.18: `listen 443 ssl http2;` is the syntax valid on every version
# (newer nginx prints a deprecation warning, nothing more).

upstream burgerhause_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Hosts we do not serve (bare IP, other domains): close the connection.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}

# ---- HTTP: ACME challenge + redirect to HTTPS --------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name burgerhause.example.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS catch-all: unknown Host / bare IP over TLS never reaches the app -------------------------------
# (It needs a certificate to complete the handshake; we reuse ours. On nginx >= 1.19.4 you may instead use
#  `ssl_reject_handshake on;` here and drop the certificate lines. Ubuntu 22.04 ships 1.18, so we use 444.)
server {
    listen 443 ssl default_server http2;
    listen [::]:443 ssl default_server http2;
    server_name _;
    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/burgerhause.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/burgerhause.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 444;
}

# ---- HTTPS -------------------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name burgerhause.example.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/burgerhause.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/burgerhause.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:bh_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/burgerhause-headers.conf;

    access_log /var/log/nginx/burgerhause.access.log;
    error_log  /var/log/nginx/burgerhause.error.log warn;

    # Small default for everything (JSON/forms); only /api/uploads may be bigger.
    client_max_body_size 1m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 60s;
    keepalive_timeout 65s;

    # Text assets only. text/event-stream is deliberately NOT listed (compression would buffer SSE).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Never serve dotfiles (.env, .git, ...) nor source maps. (ACME lives on port 80 only.)
    location ~ /\. { return 404; }
    location ~* \.map$ { return 404; }

    # ---- uploaded images: served by Nginx straight from disk (the app's /uploads route is the fallback) --
    # The files are immutable (UUID names). No directory listing. nginx must be able to read the dir (group).
    location /uploads/ {
        alias /var/lib/burgerhause/uploads/;
        autoindex off;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/burgerhause-headers.conf;
    }

    # ---- realtime streams (SSE): no buffering, long read timeout --------------------------------------
    location = /api/events {
        limit_conn bh_sse 60;
        include /etc/nginx/snippets/burgerhause-proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        gzip off;
    }

    location = /api/agent/stream {
        limit_conn bh_sse 60;
        limit_req zone=bh_agent burst=60 nodelay;
        include /etc/nginx/snippets/burgerhause-proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        gzip off;
    }

    # ---- print agents (9 PCs, one venue IP) ----------------------------------------------------------
    location /api/agent/ {
        limit_req zone=bh_agent burst=60 nodelay;
        include /etc/nginx/snippets/burgerhause-proxy.conf;
    }

    # ---- image upload: up to 5 MB file + multipart overhead -> 6m --------------------------------------
    location /api/uploads {
        client_max_body_size 6m;
        client_body_timeout 60s;
        limit_req zone=bh_upload burst=10 nodelay;
        include /etc/nginx/snippets/burgerhause-proxy.conf;
    }

    # ---- public order page and its API ----------------------------------------------------------------
    # Regex so that "/pedido" and "/api/pedido" also match without a trailing slash.
    location ~ ^/(api/)?pedido(/|$) {
        limit_req zone=bh_pedido burst=20 nodelay;
        include /etc/nginx/snippets/burgerhause-proxy.conf;
    }

    # ---- staff login (volume cap only; the app has its own brute-force limiter) -----------------------------
    location = /login {
        limit_req zone=bh_login burst=30 nodelay;
        include /etc/nginx/snippets/burgerhause-proxy.conf;
    }

    # ---- everything else ---------------------------------------------------------------------------------
    location / {
        include /etc/nginx/snippets/burgerhause-proxy.conf;
    }
}
