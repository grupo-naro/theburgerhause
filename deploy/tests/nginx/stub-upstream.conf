# Fake "Next.js" on 127.0.0.1:3000 for deploy/tests/nginx-test.sh: echoes what the proxy sent.
server {
    listen 127.0.0.1:3000;
    server_name _;
    client_max_body_size 50m;   # the proxy under test must be the one enforcing limits

    location = /api/events {
        default_type text/event-stream;
        add_header X-Accel-Buffering no;
        return 200 "event: hello\ndata: {}\n\n";
    }

    # Like the real /pedido pages: the app sets its own Referrer-Policy.
    location /pedido/ {
        add_header Referrer-Policy no-referrer;
        default_type text/plain;
        return 200 "pedido";
    }

    location = /big.txt {
        default_type text/plain;
        return 200 "";
    }

    # Like the real app: it sets these itself, Nginx must show each of them exactly once.
    location = /hardened {
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-Powered-By Express;
        default_type text/plain;
        return 200 "hardened";
    }

    location / {
        default_type text/plain;
        return 200 "xff=$http_x_forwarded_for|host=$http_host|xfh=$http_x_forwarded_host|xfp=$http_x_forwarded_proto|conn=$http_connection|realip=$http_x_real_ip|fwd=$http_forwarded|mw=$http_x_middleware_subrequest|uri=$request_uri";
    }
}
