# Main config used ONLY by deploy/tests/nginx-test.sh (the real one is the distro's /etc/nginx/nginx.conf).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    include /etc/nginx/conf.d/*.conf;        # = deploy/nginx/conf.d (zones)
    include /etc/nginx/sites-enabled/*.conf; # = deploy/nginx/burgerhause.conf
    include /etc/nginx/stub/*.conf;          # fake upstream on 127.0.0.1:3000
}
