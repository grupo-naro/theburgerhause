# Cabeceras de seguridad (igual que repo/deploy/nginx/snippets/burgerhause-headers.conf).
# Se incluye a nivel server{} Y dentro de cada location que tenga su propio add_header (no se heredan).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy $bh_referrer_policy always;
