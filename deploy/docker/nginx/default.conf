# The Burger House: adaptación de repo/deploy/nginx/* para Docker detrás de Cloudflare Tunnel + Traefik.
# TLS lo termina Cloudflare. Este nginx existe para:
#  - poner en X-Forwarded-For la IP REAL del cliente (CF-Connecting-IP) como un solo valor: la app usa el
#    ÚLTIMO hop para limitar intentos (src/lib/client-ip.ts). Sin esto, todos serían la IP de cloudflared.
#  - límites por IP, 6 MB solo en /api/uploads, SSE sin buffer, encabezados de seguridad (igual que el repo).
#  - página "Reconectando…" durante deploys/caídas (error_page 502 503 504), y /uploads/ servido desde disco.
# Si editás este archivo: docker compose up -d --force-recreate web   (el bind mount de un archivo no se recarga)

# Solo se confía en CF-Connecting-IP si el pedido viene de la red Docker "proxy" (Traefik; sin puertos al host).
set_real_ip_from 10.0.250.0/24;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

# DNS interno de Docker: la IP de la app cambia en cada deploy (contenedor nuevo). Sin "resolve", nginx se queda
# con la IP vieja y responde 502 hasta que se lo reinicia.
resolver 127.0.0.11 valid=10s ipv6=off;

limit_req_zone $binary_remote_addr zone=bh_pedido:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=bh_login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=bh_agent:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=bh_upload:10m rate=2r/s;
# Resto (páginas, Server Actions, health): tope de volumen contra floods; /_next/static/ queda exento.
limit_req_zone $binary_remote_addr zone=bh_general:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=bh_sse:10m;
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
limit_conn_log_level warn;

map $upstream_http_referrer_policy $bh_referrer_policy {
    default "";
    ""      "strict-origin-when-cross-origin";
}
# Esquema que vio el cliente en Cloudflare (cloudflared -> Traefik lo pasan en X-Forwarded-Proto).
map $http_x_forwarded_proto $bh_proto {
    default https;
    http    http;
}

upstream burgerhause_app {
    zone burgerhause_app 64k;
    server burgerhause-app:3000 resolve;   # NO "app": en la red proxy puede haber otro "app"
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # La cookie de sesión es Secure: forzar HTTPS si Cloudflare dejó pasar http.
    if ($bh_proto = http) { return 301 https://$host$request_uri; }

    include /etc/nginx/bh-headers.conf;

    # App reiniciando (cada deploy) o caída: nginx sirve una página que se recarga sola cada 10 s, así la TV
    # del mostrador (/pantalla) y las pantallas abiertas vuelven solas. Solo errores que genera nginx
    # (upstream inalcanzable/timeout); las respuestas propias de la app (p. ej. /api/health 503) pasan tal cual.
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /usr/share/nginx/maintenance;
        internal;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/bh-headers.conf;
    }

    client_max_body_size 1m;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 60s;
    keepalive_timeout 65s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Ajustes comunes de proxy (en nginx se heredan a las location que no definen los suyos).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $bh_proto;
    # SOBRESCRIBIR con la IP real (nunca $proxy_add_x_forwarded_for).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header x-middleware-subrequest "";
    proxy_next_upstream off;
    # La app también los pone; los pone nginx (arriba), así que se oculta la copia del upstream (uno solo de cada).
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Powered-By;

    location ~ /\. { return 404; }
    location ~* \.map$ { return 404; }

    # Fotos subidas: nginx las sirve directo del disco (nombres UUID inmutables). La ruta /uploads de la app queda
    # de respaldo si no estuviera montado.
    location /uploads/ {
        alias /srv/uploads/;
        autoindex off;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/bh-headers.conf;
    }

    location = /api/events {
        limit_conn bh_sse 60;
        proxy_pass http://burgerhause_app;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        gzip off;
    }

    location = /api/agent/stream {
        limit_conn bh_sse 60;
        limit_req zone=bh_agent burst=60 nodelay;
        proxy_pass http://burgerhause_app;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        gzip off;
    }

    location /api/agent/ {
        limit_req zone=bh_agent burst=60 nodelay;
        proxy_pass http://burgerhause_app;
    }

    location /api/uploads {
        client_max_body_size 6m;
        client_body_timeout 60s;
        limit_req zone=bh_upload burst=10 nodelay;
        proxy_pass http://burgerhause_app;
    }

    location ~ ^/(api/)?pedido(/|$) {
        limit_req zone=bh_pedido burst=20 nodelay;
        proxy_pass http://burgerhause_app;
    }

    location = /login {
        limit_req zone=bh_login burst=30 nodelay;
        proxy_pass http://burgerhause_app;
    }

    location /_next/static/ {
        proxy_pass http://burgerhause_app;
    }

    location / {
        limit_req zone=bh_general burst=100 nodelay;
        proxy_pass http://burgerhause_app;
    }
}
